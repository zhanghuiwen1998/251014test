name: CI/CD Pipeline

# 触发条件
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 环境变量
env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.11'

jobs:
  # 代码质量检查
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
      if: hashFiles('package.json') != ''
      
    - name: Install Node.js dependencies
      run: npm ci
      if: hashFiles('package.json') != ''
      
    - name: Run ESLint
      run: npm run lint
      if: hashFiles('package.json') != ''
      continue-on-error: true
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
      if: hashFiles('requirements.txt') != '' || hashFiles('pyproject.toml') != ''
      
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f pyproject.toml ]; then pip install -e .; fi
      if: hashFiles('requirements.txt') != '' || hashFiles('pyproject.toml') != ''
      
    - name: Run Python linting
      run: |
        pip install flake8 black isort
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        black --check .
        isort --check-only .
      if: hashFiles('**/*.py') != ''
      continue-on-error: true

  # 测试任务
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    # Node.js 测试
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
      if: hashFiles('package.json') != ''
      
    - name: Install Node.js dependencies
      run: npm ci
      if: hashFiles('package.json') != ''
      
    - name: Run Node.js tests
      run: npm test
      if: hashFiles('package.json') != ''
      
    # Python 测试
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
      if: hashFiles('requirements.txt') != '' || hashFiles('pyproject.toml') != ''
      
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f pyproject.toml ]; then pip install -e .; fi
        pip install pytest pytest-cov
      shell: bash
      if: hashFiles('requirements.txt') != '' || hashFiles('pyproject.toml') != ''
      
    - name: Run Python tests
      run: pytest --cov=. --cov-report=xml
      if: hashFiles('**/*.py') != '' && hashFiles('**/test_*.py') != ''
      
    # Go 测试
    - name: Setup Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
      if: hashFiles('go.mod') != ''
      
    - name: Run Go tests
      run: go test -v ./...
      if: hashFiles('go.mod') != ''

  # 构建任务
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [lint, test]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
      if: hashFiles('package.json') != ''
      
    - name: Install dependencies and build
      run: |
        npm ci
        npm run build
      if: hashFiles('package.json') != ''
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: build-artifacts
        path: |
          dist/
          build/
          out/
        retention-days: 30
      if: hashFiles('package.json') != ''

  # 安全扫描
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'
      if: always()

  # 部署任务 (仅在main分支)
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download build artifacts
      uses: actions/download-artifact@v3
      with:
        name: build-artifacts
        path: ./artifacts
        
    - name: Deploy application
      id: deploy
      run: |
        echo "Deploying to production..."
        # 这里添加实际的部署逻辑
        echo "url=https://your-app.com" >> $GITHUB_OUTPUT
        
  # 通知任务
  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [lint, test, build, security]
    if: always()
    
    steps:
    - name: Notify success
      if: ${{ needs.lint.result == 'success' && needs.test.result == 'success' && needs.build.result == 'success' }}
      run: |
        echo "✅ All checks passed successfully!"
        
    - name: Notify failure
      if: ${{ needs.lint.result == 'failure' || needs.test.result == 'failure' || needs.build.result == 'failure' }}
      run: |
        echo "❌ Some checks failed. Please review the logs."
